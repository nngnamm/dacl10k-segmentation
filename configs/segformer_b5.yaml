project_name: "dacl10k-segformer"
exp_name: "segformer_b5_independent"
seed: 42

data:
  data_dir: "/kaggle/input/dacl10k"  # Đường dẫn dataset trên Kaggle
  num_classes: 19
  img_size: 512                     # SegFormer thiết kế tối ưu với ảnh 512x512
  batch_size: 4                     # B5 lớn nhưng cấu trúc nhẹ hơn Swin-Large, có thể để batch_size = 4
  num_workers: 2

model:
  arch: "segformer"
  encoder_name: "mit_b5"            # MiT-B5 là backbone mạnh nhất của dòng SegFormer
  pretrained: true

train:
  epochs: 20
  lr: 0.00006                       # Learning rate chuẩn cho SegFormer fine-tune
  weight_decay: 0.01
  grad_accum_steps: 2               # Effective batch size = 4 * 2 = 8
  focal_weight: 0.5
  dice_weight: 0.5
  save_dir: "checkpoints"

eval:
  window_size: 512
  stride: 384
  threshold: 0.5